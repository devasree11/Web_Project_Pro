name: Deploy repository to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build all projects
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/index.html
          cp -R unit1 unit2 _site/

          build_app() {
            app="$1"
            target="$2"
            (
              cd "$app"
              npm ci
              npm run build -- --base="/${GITHUB_REPOSITORY#*/}${target}/" --outDir="$GITHUB_WORKSPACE/_site${target}"
            )
          }

          build_app unit3 /unit3
          build_app unit4 /unit4
          build_app unit5/medium /unit5/medium
          build_app unit5/report-card /unit5/report-card

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4