<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Student Profile Card</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}
body{
background:linear-gradient(135deg,#0F172A,#1E293B,#111827,#020617);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
}
body::before{
content:"";
position:absolute;
width:350px;
height:350px;
background:#00E5A8;
border-radius:50%;
filter:blur(140px);
top:-100px;
left:-100px;
opacity:.25;
}
body::after{
content:"";
position:absolute;
width:350px;
height:350px;
background:#38BDF8;
border-radius:50%;
filter:blur(140px);
bottom:-100px;
right:-100px;
opacity:.25;
}
.popup{
position:fixed;
top:-100px;
left:50%;
transform:translateX(-50%);
padding:15px 35px;
background:linear-gradient(135deg,#6e76f1,#6462bb);
color:white;
font-size:17px;
font-weight:bold;
border-radius:50px;
box-shadow:0 12px 25px rgba(0,0,0,.4);
transition:.5s;
z-index:999;
}
.popup.show{
top:25px;
}
.container{
width:950px;
display:flex;
gap:35px;
position:relative;
z-index:2;
}
.form-card{
width:390px;
padding:35px;
border-radius:25px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.15);
box-shadow:0 20px 45px rgba(0,0,0,.4);
}
.form-card h1{
text-align:center;
color:#22D3EE;
margin-bottom:30px;
font-size:30px;
}
input{
width:100%;
padding:15px;
margin:12px 0;
border:none;
outline:none;
border-radius:12px;
background:rgba(255,255,255,.12);
color:white;
font-size:16px;
border:1px solid rgba(255,255,255,.15);
transition:.4s;
}
input::placeholder{
color:#CBD5E1;
}
input:focus{
border:1px solid #22D3EE;
box-shadow:0 0 15px rgba(34,211,238,.6);
}
button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#10B981,#06B6D4);
font-size:18px;
font-weight:bold;
color:white;
cursor:pointer;
transition:.4s;
}
button:hover{
transform:translateY(-3px);
box-shadow:0 12px 25px rgba(16,185,129,.45);
}
.profile-card{
flex:1;
display:none;
padding:35px;
border-radius:25px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.15);
box-shadow:0 20px 45px rgba(0,0,0,.4);
text-align:center;
color:white;
animation:fade .6s ease;
}
@keyframes fade{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}
.avatar{
width:130px;
height:130px;
margin:auto;
border-radius:50%;
background:linear-gradient(135deg,#10B981,#06B6D4);
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
font-weight:bold;
color:white;
margin-bottom:20px;
box-shadow:0 10px 30px rgba(16,185,129,.5);
}
.profile-card h2{
font-size:28px;
color:#22D3EE;
margin-bottom:20px;
}
.profile-card p{
font-size:20px;
padding:10px;
margin:10px 0;
background:rgba(255,255,255,.08);
border-radius:10px;
}
.grade{
display:inline-block;
margin-top:20px;
padding:12px 35px;
border-radius:40px;
font-size:22px;
font-weight:bold;
letter-spacing:1px;
color:white;
box-shadow:0 10px 20px rgba(0,0,0,.3);
}
</style>
</head>
<body>
<div id="popup" class="popup">
⚠ Please fill all the details!
</div>
<div class="container">
<div class="form-card">
<h1>Student Profile</h1>
<input type="text" id="name" placeholder="Enter Student Name">
<input type="text" id="roll" placeholder="Enter Roll Number">
<input type="number" id="marks" placeholder="Enter Marks">
<button onclick="displayProfile()">
Display Profile
</button>
</div>
<div class="profile-card" id="card">
<div class="avatar" id="avatar">A</div>
<h2>Student Details</h2>
<p><b>Name :</b> <span id="sname"></span></p>
<p><b>Roll No :</b> <span id="sroll"></span></p>
<p><b>Marks :</b> <span id="smarks"></span></p>
<div id="grade" class="grade"></div>
</div>
</div>
<script>
function displayProfile(){
let name=document.getElementById("name").value.trim();
let roll=document.getElementById("roll").value.trim();
let marks=document.getElementById("marks").value.trim();
let popup=document.getElementById("popup");
if(name=="" || roll=="" || marks==""){
popup.innerHTML="⚠ Please fill all the details!";
popup.classList.add("show");
setTimeout(function(){
popup.classList.remove("show");
},3000);
return;
}
marks=Number(marks);
if(marks<0 || marks>100){
popup.innerHTML="⚠ Enter marks between 0 and 100!";
popup.classList.add("show");
setTimeout(function(){
popup.classList.remove("show");
},3000);
return;
}
let grade="";
let color="";
if(marks>=90){
grade="A+";
color="linear-gradient(135deg,#10B981,#059669)";
}
else if(marks>=80){
grade="A";
color="linear-gradient(135deg,#06B6D4,#0284C7)";
}
else if(marks>=70){
grade="B";
color="linear-gradient(135deg,#8B5CF6,#6D28D9)";
}
else if(marks>=60){
grade="C";
color="linear-gradient(135deg,#F59E0B,#D97706)";
}
else if(marks>=50){
grade="D";
color="linear-gradient(135deg,#F97316,#EA580C)";
}
else{
grade="FAIL";
color="linear-gradient(135deg,#DC2626,#991B1B)";
}
document.getElementById("card").style.display="block";
document.getElementById("avatar").innerHTML=name.charAt(0).toUpperCase();
document.getElementById("sname").innerHTML=name;
document.getElementById("sroll").innerHTML=roll;
document.getElementById("smarks").innerHTML=marks;
document.getElementById("grade").innerHTML="Grade : "+grade;
document.getElementById("grade").style.background=color;
}
</script>
</body>
</html>
