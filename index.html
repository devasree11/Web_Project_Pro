<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f5f2" />
    <title>Web Project Portfolio</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
        color: #202b28;
        background: #f3f5f2;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main { width: min(900px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0; }
      .eyebrow { color: #39745f; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { max-width: 620px; margin: 12px 0; font-family: Georgia, serif; font-size: clamp(2.5rem, 7vw, 4.5rem); font-weight: 500; line-height: 1.02; }
      .intro { max-width: 550px; color: #586660; font-size: 1.05rem; line-height: 1.65; }
      .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 40px; }
      a { display: flex; min-height: 82px; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; border: 1px solid #d8dfda; border-radius: 6px; color: inherit; background: #fff; font-weight: 650; text-decoration: none; transition: border-color 140ms ease, transform 140ms ease; }
      a:hover, a:focus-visible { border-color: #39745f; transform: translateY(-2px); }
      a span { color: #39745f; font-size: 1.2rem; }
      @media (max-width: 520px) { main { padding-top: 48px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Web Project Pro</p>
      <h1>Projects, collected in one place.</h1>
      <p class="intro">A collection of interactive projects, web experiences, and apps built across Units 1 through 5.</p>
      <nav class="projects" aria-label="Project units">
        <a href="./unit1/">Unit 1 · Counter App <span aria-hidden="true">↗</span></a>
        <a href="./unit2/">Unit 2 · Developer Portfolio <span aria-hidden="true">↗</span></a>
        <a href="./unit3/">Unit 3 · React Projects <span aria-hidden="true">↗</span></a>
        <a href="./unit4/">Unit 4 · Portfolio <span aria-hidden="true">↗</span></a>
        <a href="./unit5/medium/">Unit 5 · Task Manager <span aria-hidden="true">↗</span></a>
        <a href="./unit5/report-card/">Unit 5 · Report Card <span aria-hidden="true">↗</span></a>
      </nav>
    </main>
  </body>
</html>
